name: Test
"on":
  push:
    branches:
      - develop
      - feature/**
      - hotfix/**
      - renovate/**
  pull_request:
    types:
      - opened
      - synchronize
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run lint
      - run: pnpm run build
      - run: pnpm run test
      - run: pnpm --dir libs/scene-preview exec playwright-core install --with-deps chromium
      - run: pnpm run test:consumer
      - run: node tools/scripts/test-shoe-camera.mjs
