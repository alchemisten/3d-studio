name: Pages
"on":
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: pages-deploy
  cancel-in-progress: false
jobs:
  deploy:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      TARGETS: ${{ github.event_name == 'pull_request' && format('pr/{0}', github.event.pull_request.number) || (startsWith(github.ref, 'refs/tags/') && format('{0} latest', github.ref_name) || (github.ref_name == 'main' && 'latest' || (github.ref_name == 'develop' && 'next' || ''))) }}
      CLOSED: ${{ github.event_name == 'pull_request' && github.event.action == 'closed' }}
    steps:
      - uses: actions/checkout@v6
      - name: Prepare gh-pages branch
        run: |
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null; then
            git fetch origin gh-pages --depth=1
            git worktree add ../pages-branch origin/gh-pages
            git -C ../pages-branch checkout -B gh-pages
          else
            git worktree add --no-checkout --detach ../pages-branch
            git -C ../pages-branch checkout --orphan gh-pages
            git -C ../pages-branch rm -rf . >/dev/null
            git -C ../pages-branch clean -fdxq
          fi
      - uses: actions/setup-node@v6
        if: env.CLOSED != 'true' && env.TARGETS != ''
        with:
          node-version: 22
          cache: npm
      - name: Build Storybook
        if: env.CLOSED != 'true' && env.TARGETS != ''
        run: |
          npm ci
          # Vite's public-dir copy occasionally races with itself (EEXIST); a retry clears it.
          npx nx run docs:build-storybook || { rm -rf dist/pages/storybook; npx nx run docs:build-storybook --skip-nx-cache; }
        env:
          CYPRESS_INSTALL_BINARY: '0'
      - name: Publish into target folders
        if: env.TARGETS != ''
        run: |
          for target in $TARGETS; do
            rm -rf "../pages-branch/$target"
            if [ "$CLOSED" != "true" ]; then
              mkdir -p "../pages-branch/$target"
              cp -r dist/pages/storybook/. "../pages-branch/$target/"
            fi
          done
          cp apps/docs/landing/index.html ../pages-branch/index.html
          touch ../pages-branch/.nojekyll
          node tools/scripts/pages-versions.mjs ../pages-branch
          cd ../pages-branch
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "pages: update $TARGETS ($GITHUB_SHA)"
          git push origin gh-pages
      - name: Comment preview link
        if: github.event_name == 'pull_request' && github.event.action != 'closed'
        run: |
          owner="${GITHUB_REPOSITORY%%/*}"
          repo="${GITHUB_REPOSITORY##*/}"
          gh pr comment "$PR" --edit-last --create-if-none \
            --body "Storybook preview: https://${owner}.github.io/${repo}/pr/${PR}/ (updated for ${GITHUB_SHA::7}, removed when the PR closes)"
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
